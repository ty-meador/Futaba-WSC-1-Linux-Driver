[project]
name = "futaba-rc-driver"
version = "1.5.1"
description = "A Futaba RC Driver for Linux."
requires-python = ">=3.11.0"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = ["nuitka==2.7.14", "python-uinput==1.0.1", "pyusb==1.3.1"]

[project.urls]
Distributables = "https://tylermeador.com/futaba-rc-driver/dist"
Documentation = "https://tylermeador.com/futaba-rc-driver/docs"
Homepage = "https://tylermeador.com/futaba-rc-driver"
Issues = "https://gitlab.com/futaba-linux-support/futaba-rc-linux-driver/-/issues"
LatestDistributable = "https://tylermeador.com/futaba-rc-driver/dist/latest"
Repository = "https://gitlab.com/Native-Coder/futaba-usb-driver/"

[project.scripts]
futaba-rc-driver = "main:main"  # Calls main() function in main.py

[build-system]
requires = [
  "mypy==1.19.1",
  "nuitka~=2.7.12",
  "setuptools~=64.0",
  "wheel",
  "zstandard==0.25.0"
]
build-backend = "setuptools.build_meta"

[tool.black]
target-version = ["py311"]
line-length = 120
skip-string-normalization = true
skip-magic-trailing-comma = true
force-exclude = '''
/(
  | docs
  | setup.py
)/
'''

[tool.build_tool]
native_dependencies = ["usb", "uinput"]
install_script_name = "install.sh"
uninstall_script_name = "uninstall.sh"
web_install_script_name = "web-installer.sh"
executable_name = "futaba-rc-driver"
build_dir = "build"
package_dir = "dist"
install_dir = "${HOME}/.local/opt/futaba-rc-driver"
bin_dir = "${HOME}/.local/bin"

[tool.isort]
py_version = 311
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
known_third_party = []
known_first_party = []
known_local_folder = []
# style: black
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
split_on_trailing_comma = true
lines_after_imports = 2
force_single_line = true
skip_glob = ["docs/*", "setup.py"]
filter_files = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
stubPath = "typings"
exclude = ["docs", "setup.py", ".venv", "build", "dist"]

[[tool.pyright.executionEnvironments]]
root = "."
include = ["src/**"]  # All files in stubs directory
reportIncompleteStub = false

[tool.setuptools]
packages = ["Futaba"]

[tool.setuptools.package-dir]
"" = "src"
