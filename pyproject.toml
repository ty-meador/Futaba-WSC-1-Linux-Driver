[project]
name = "futaba-rc-driver"
version = "1.5.6"
description = "A Futaba RC Driver for Linux."
requires-python = ">=3.11.0"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = ["hid-parser==0.1.0", "nuitka==2.7.14", "python-uinput==1.0.1", "pyusb==1.3.1"]

[project.optional-dependencies]
dev = ["mypy==1.19.1", "sphinx", "sphinx_rtd_theme"]

[project.urls]
Distributables = "https://gitlab.com/Tyler-Meador/futaba-usb-driver/-/releases"
Documentation = "https://gitlab.com/Tyler-Meador/futaba-usb-driver/-/blob/main/developers_guide/README.md"
Homepage = "https://gitlab.com/Tyler-Meador/futaba-usb-driver"
Issues = "https://gitlab.com/Tyler-Meador/futaba-usb-driver/-/issues"
LatestDistributable = "https://gitlab.com/Tyler-Meador/futaba-usb-driver/-/releases/permalink/latest"
Repository = "https://gitlab.com/Tyler-Meador/futaba-usb-driver/"

[project.scripts]
futaba-rc-driver = "main:main"  # Calls main() function in main.py

[build-system]
requires = [
  "mypy==1.19.1",
  "nuitka~=2.7.12",
  "setuptools>=68",  # 64.x breaks on Python 3.12 (pkgutil.ImpImporter removed)
  "wheel",
  "zstandard==0.25.0"
]
build-backend = "setuptools.build_meta"

[tool.black]
target-version = ["py311"]
line-length = 120
skip-string-normalization = true
skip-magic-trailing-comma = true
force-exclude = '''
/(
  | docs
  | setup.py
)/
'''

[tool.build_tool]
native_dependencies = ["usb", "uinput"]
install_script_name = "install.sh"
uninstall_script_name = "uninstall.sh"
executable_name = "futaba-rc-driver"
build_dir = "build"
package_dir = "dist"
install_dir = "${HOME}/.local/opt/futaba-rc-driver"
bin_dir = "${HOME}/.local/bin"

[tool.isort]
py_version = 311
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
known_third_party = []
known_first_party = []
known_local_folder = []
# style: black
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
split_on_trailing_comma = true
lines_after_imports = 2
force_single_line = true
skip_glob = ["docs/*", "setup.py"]
filter_files = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
stubPath = "typings"
exclude = ["docs", "setup.py", ".venv", "build", "dist"]

[[tool.pyright.executionEnvironments]]
root = "."
include = ["src/**"]  # All files in stubs directory
reportIncompleteStub = false

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
# Same as Black.
line-length = 88
indent-width = 4
# Assume Python 3.9
target-version = "py39"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "YTT", "TD", "W"]
ignore = []
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false
# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["Futaba*"]
